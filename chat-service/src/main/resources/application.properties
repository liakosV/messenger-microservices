spring.application.name=chat-service
server.port=8083
spring.datasource.url=${CHAT_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=true
chat.jwt.public-key=${CHAT_JWT_PUBLIC_KEY}
chat.jwt.issuer=${IDENTITY_JWT_ISSUER:http://localhost:8082}
chat.identity.base-url=${IDENTITY_BASE_URL:http://localhost:8082}
chat.websocket.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
