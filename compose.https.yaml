services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  chat-service:
    environment:
      CHAT_ALLOWED_ORIGINS: https://liakos-messenger.duckdns.org,http://localhost:5173

volumes:
  caddy_data:
  caddy_config:
